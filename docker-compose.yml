services:
  overwatch-api:
    build:
      context: .
      dockerfile: src/API/DeveloperOverwatch.API/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - Database__ConnectionString=Data Source=/data/overwatch.db
      - ApiKeys__Keys__0=dev-local-test-key
    volumes:
      - overwatch-data:/data

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - API_UPSTREAM=http://overwatch-api:3001
    depends_on:
      - overwatch-api

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"

volumes:
  overwatch-data:
